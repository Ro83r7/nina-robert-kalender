<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nina &amp; Robert</title>
<meta name="theme-color" content="#faf7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14121a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nina &amp; Robert">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales/de.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/daygrid@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/timegrid@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/list@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/interaction@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/multimonth@6.1.15/index.global.min.js"></script>
</head>
<body>

<div id="demo-banner" class="banner" hidden>
  Demo-Modus: Termine werden <strong>nicht</strong> dauerhaft gespeichert.
</div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">♥</span>
    <h1>Nina <span class="amp">&amp;</span> Robert</h1>
    <span id="sync-status" class="sync" title="Verbindung wird aufgebaut …"><span class="sync-dot"></span><span class="sync-label">Verbinde …</span></span>
  </div>
  <div class="filters" role="group" aria-label="Termine filtern">
    <button type="button" class="chip" data-person="nina" aria-pressed="true"><span class="avatar nina">N</span>Nina</button>
    <button type="button" class="chip" data-person="robert" aria-pressed="true"><span class="avatar robert">R</span>Robert</button>
    <button type="button" class="chip" data-person="zusammen" aria-pressed="true"><span class="avatar zusammen">♥</span>Zusammen</button>
  </div>
  <button id="add-btn" class="add-btn" type="button"><span aria-hidden="true">+</span> Termin</button>
</header>

<main class="layout">
  <aside class="sidebar">
    <section id="countdown" class="card countdown" hidden>
      <p class="countdown-kicker">Nächstes gemeinsames Highlight</p>
      <p class="countdown-title" id="countdown-title"></p>
      <p class="countdown-days"><span id="countdown-num"></span> <span id="countdown-unit"></span></p>
      <p class="countdown-date" id="countdown-date"></p>
    </section>

    <section class="card upcoming">
      <h2>Als Nächstes</h2>
      <ul id="upcoming-list" class="upcoming-list"></ul>
      <p id="upcoming-empty" class="empty" hidden>Keine Termine in den nächsten 60 Tagen. Zeit, etwas zu planen! ✨</p>
    </section>
  </aside>

  <section class="card calendar-card">
    <div id="calendar"></div>
  </section>
</main>

<button id="fab" class="fab" type="button" aria-label="Neuer Termin">+</button>

<div id="modal-overlay" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-heading">
    <div class="modal-head">
      <h2 id="modal-heading">Neuer Termin</h2>
      <button id="close-btn" class="icon-btn" type="button" aria-label="Schließen">✕</button>
    </div>

    <div class="title-row">
      <button id="emoji-btn" class="emoji-btn" type="button" aria-label="Symbol wählen" aria-expanded="false">＋</button>
      <input type="text" id="f-title" placeholder="Was steht an?" autocomplete="off" maxlength="120">
    </div>
    <div id="emoji-picker" class="emoji-picker" hidden></div>

    <div class="field">
      <span class="field-label">Wer?</span>
      <div class="segmented" id="f-person" role="radiogroup" aria-label="Wer?">
        <button type="button" role="radio" data-value="nina" class="seg nina"><span class="avatar nina">N</span>Nina</button>
        <button type="button" role="radio" data-value="robert" class="seg robert"><span class="avatar robert">R</span>Robert</button>
        <button type="button" role="radio" data-value="zusammen" class="seg zusammen"><span class="avatar zusammen">♥</span>Zusammen</button>
      </div>
    </div>

    <label class="switch">
      <input type="checkbox" id="f-allday" checked>
      <span class="switch-track" aria-hidden="true"></span>
      Ganztägig
    </label>

    <div class="row">
      <label class="field">Beginn
        <input type="date" id="f-start-date">
      </label>
      <label class="field time-field" id="f-start-time-wrap">Uhrzeit
        <input type="time" id="f-start-time">
      </label>
    </div>

    <div class="row">
      <label class="field">Ende
        <input type="date" id="f-end-date">
      </label>
      <label class="field time-field" id="f-end-time-wrap">Uhrzeit
        <input type="time" id="f-end-time">
      </label>
    </div>

    <div class="row">
      <label class="field">Wiederholen
        <select id="f-repeat">
          <option value="none">Nie</option>
          <option value="weekly">Jede Woche</option>
          <option value="monthly">Jeden Monat</option>
          <option value="yearly">Jedes Jahr</option>
        </select>
      </label>
    </div>

    <label class="field">Ort
      <input type="text" id="f-location" placeholder="optional" autocomplete="off" maxlength="200">
    </label>

    <label class="field">Notiz
      <textarea id="f-notes" rows="2" placeholder="optional" maxlength="2000"></textarea>
    </label>

    <p id="form-error" class="form-error" hidden></p>

    <div class="modal-actions">
      <button id="delete-btn" class="btn danger" type="button" hidden>Löschen</button>
      <button id="duplicate-btn" class="btn ghost" type="button" hidden>Duplizieren</button>
      <span class="spacer"></span>
      <button id="cancel-btn" class="btn" type="button">Abbrechen</button>
      <button id="save-btn" class="btn primary" type="button">Speichern</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden>
  <span id="toast-text"></span>
  <button id="toast-action" type="button" hidden></button>
</div>

<!-- Bump ?v= on app.js/style.css whenever they change - GitHub Pages caches them for 10 minutes -->
<script type="module" src="app.js?v=3"></script>
</body>
</html>
